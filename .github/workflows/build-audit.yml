name: Build & Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/generate.js
      - name: Audit
        run: node scripts/lib/audit.js .
      - name: Assert deterministic build
        run: |
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/freeze-clock.cjs" \
            BUILD_CLOCK=2026-12-31T23:30:00Z node scripts/generate.js
          find public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/a.sha
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/freeze-clock.cjs" \
            BUILD_CLOCK=2027-01-01T00:30:00Z TZ=Pacific/Kiritimati node scripts/generate.js
          find public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/b.sha
          diff -u /tmp/a.sha /tmp/b.sha
